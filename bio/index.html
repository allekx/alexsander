<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Identidade Web — Sua empresa profissional na internet. Estrutura digital, site e presença no Google." />
  <meta name="theme-color" content="#F5F7FA" />
  <title>Identidade Web | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5F7FA;
      --navy: #0A2540;
      --white: #FFFFFF;
      --muted: #64748B;
      --whatsapp: #25D366;
      --whatsapp-hover: #20BD5A;
      --whatsapp-shadow: rgba(37, 211, 102, 0.35);
      --card-border: rgba(10, 37, 64, 0.07);
      --shadow-sm: 0 1px 2px rgba(10, 37, 64, 0.04);
      --shadow-md: 0 4px 14px rgba(10, 37, 64, 0.07);
      --shadow-lg: 0 12px 40px rgba(10, 37, 64, 0.1);
      --radius-pill: 9999px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --stagger: 0.06s;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--navy);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 400px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* Profile */
    .profile {
      text-align: center;
      margin-bottom: 2rem;
    }
    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: var(--white);
      box-shadow:
        0 1px 2px rgba(10, 37, 64, 0.06),
        0 8px 24px rgba(10, 37, 64, 0.08),
        0 24px 48px rgba(10, 37, 64, 0.06);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }
    .name {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: clamp(1.375rem, 4.5vw, 1.5rem);
      letter-spacing: -0.03em;
      color: var(--navy);
      margin-bottom: 0.35rem;
    }
    .tagline {
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--muted);
      max-width: 280px;
      margin: 0 auto;
      line-height: 1.45;
    }

    /* Links stack */
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex: 1;
    }

    .link {
      display: grid;
      grid-template-columns: 2.75rem 1fr 2.75rem;
      align-items: center;
      min-height: 52px;
      padding: 0.85rem 1.15rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.9375rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
      cursor: pointer;
      transition:
        transform 0.35s var(--ease-out),
        box-shadow 0.35s var(--ease-out),
        background 0.25s ease,
        border-color 0.25s ease,
        color 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .link::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 45%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .link:hover::after { opacity: 1; }

    .link:active {
      transform: scale(0.985);
      transition-duration: 0.1s;
    }

    .link--primary {
      background: var(--whatsapp);
      color: var(--white);
      box-shadow: 0 4px 16px var(--whatsapp-shadow);
      border-color: rgba(255, 255, 255, 0.12);
    }
    .link--primary:hover {
      background: var(--whatsapp-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--whatsapp-shadow);
    }
    .link--primary .link-icon { color: var(--white); }

    .link--secondary {
      background: var(--white);
      color: var(--navy);
      border-color: var(--card-border);
      box-shadow: var(--shadow-sm), var(--shadow-md);
    }
    .link--secondary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md), var(--shadow-lg);
      border-color: rgba(10, 37, 64, 0.1);
    }
    .link--secondary .link-icon {
      color: var(--navy);
      opacity: 0.85;
    }

    .link-icon {
      grid-column: 1;
      justify-self: start;
      align-self: center;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .link-icon svg {
      width: 22px;
      height: 22px;
      display: block;
    }
    .link-label {
      grid-column: 2;
      text-align: center;
      justify-self: stretch;
      line-height: 1.25;
    }

    /* Entrance */
    .enter {
      opacity: 0;
      transform: translateY(14px);
      animation: enterUp 0.65s var(--ease-out) forwards;
    }
    @keyframes enterUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .enter-1 { animation-delay: calc(var(--stagger) * 0); }
    .enter-2 { animation-delay: calc(var(--stagger) * 2); }
    .enter-3 { animation-delay: calc(var(--stagger) * 4); }
    .enter-4 { animation-delay: calc(var(--stagger) * 6); }
    .enter-5 { animation-delay: calc(var(--stagger) * 8); }
    .enter-6 { animation-delay: calc(var(--stagger) * 10); }
    .enter-7 { animation-delay: calc(var(--stagger) * 12); }
    .enter-8 { animation-delay: calc(var(--stagger) * 14); }
    .enter-9 { animation-delay: calc(var(--stagger) * 17); }

    @media (prefers-reduced-motion: reduce) {
      .enter {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .link:hover { transform: none; }
      .link:active { transform: none; }
    }

    .footer {
      margin-top: auto;
      padding-top: 2.5rem;
      text-align: center;
    }
    .footer p {
      font-size: 0.75rem;
      color: rgba(100, 116, 139, 0.75);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="profile">
      <div class="avatar enter enter-1">
        <img src="../assets/logo%20identidade%20web.png" alt="" width="76" height="76" decoding="async" />
      </div>
      <h1 class="name enter enter-2">Identidade Web</h1>
      <p class="tagline enter enter-3">Sua empresa profissional na internet</p>
    </header>

    <nav class="links" aria-label="Links principais">
      <a class="link link--primary enter enter-4" id="link-whatsapp" href="#" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.881 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        </span>
        <span class="link-label">Falar no WhatsApp</span>
      </a>

      <a class="link link--secondary enter enter-5" href="../index.html" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
        </span>
        <span class="link-label">Ver nosso site</span>
      </a>

      <a class="link link--secondary enter enter-6" id="link-instagram" href="#" target="_blank" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37zM17.5 6.5h.01"/></svg>
        </span>
        <span class="link-label">Instagram</span>
      </a>

      <a class="link link--secondary enter enter-7" href="mailto:contato@identidadeweb.com.br?subject=Contato%20Identidade%20Web">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </span>
        <span class="link-label">Fale por E-mail</span>
      </a>

      <a class="link link--secondary enter enter-8" href="../index.html#servicos" rel="noopener noreferrer">
        <span class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
        </span>
        <span class="link-label">Portfólio</span>
      </a>
    </nav>

    <footer class="footer enter enter-9">
      <p>© 2026 Identidade Web</p>
    </footer>
  </div>

  <script>
    (function () {
      'use strict';
      /** Ajuste estes valores */
      var WHATSAPP_NUMBER = '5511999999999';
      var WHATSAPP_MESSAGE = 'Olá, quero minha estrutura digital com a Identidade Web';
      var INSTAGRAM_URL = 'https://www.instagram.com/';

      var wa = document.getElementById('link-whatsapp');
      if (wa) {
        wa.href = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(WHATSAPP_MESSAGE);
        wa.setAttribute('target', '_blank');
      }
      var ig = document.getElementById('link-instagram');
      if (ig && INSTAGRAM_URL && INSTAGRAM_URL !== '#') {
        ig.href = INSTAGRAM_URL;
      }
    })();
  </script>
</body>
</html>
