<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://identidadeweb.com/bio/" />
  <meta name="description" content="Sites profissionais, landing pages e soluções digitais sob medida para empresas. Identidade Web." />
  <meta name="theme-color" content="#0A2540" />
  <meta property="og:title" content="Identidade Web | Presença Digital" />
  <meta property="og:description" content="Sites profissionais, landing pages e soluções digitais sob medida para empresas." />
  <meta property="og:url" content="https://identidadeweb.com/bio/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://identidadeweb.com/assets/logo%20identidade%20web.png" />
  <title>Identidade Web | Presença Digital</title>
  <link rel="icon" type="image/png" href="../assets/logo%20identidade%20web.png" sizes="96x96" />
  <link rel="apple-touch-icon" href="../assets/logo%20identidade%20web.png" sizes="180x180" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0A2540;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --white: #FFFFFF;
      --muted: rgba(255, 255, 255, 0.66);
      --line: rgba(255, 255, 255, 0.12);
    --radius: 14px;
      --ease: 0.25s ease;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 8px 18px rgba(59, 130, 246, 0.28)); }
      50% { filter: drop-shadow(0 10px 28px rgba(59, 130, 246, 0.5)); }
    }

    @keyframes pulse-soft {
      0%, 100% { box-shadow: 0 8px 22px rgba(59, 130, 246, 0.28); }
      50% { box-shadow: 0 10px 28px rgba(59, 130, 246, 0.42); }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--navy);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59, 130, 246, 0.32), transparent 55%),
        radial-gradient(circle at 88% 78%, rgba(59, 130, 246, 0.12), transparent 28%),
        linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
      background-size: auto, auto, 28px 28px, 28px 28px;
      color: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      width: 7px;
      height: 7px;
      background: var(--accent);
      opacity: 0.45;
      top: 18%;
      left: 14%;
      box-shadow:
        72vw 8vh 0 0 rgba(147, 197, 253, 0.35),
        18vw 72vh 0 1px rgba(59, 130, 246, 0.35),
        80vw 62vh 0 0 rgba(59, 130, 246, 0.25);
      pointer-events: none;
      z-index: 0;
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(400px, calc(100% - 2rem));
      height: 100dvh;
      height: 100svh;
      margin: 0 auto;
      padding: max(1.75rem, env(safe-area-inset-top)) 0 max(1.25rem, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand {
      text-align: center;
      flex-shrink: 0;
      padding-top: 0.35rem;
    }

    .brand-logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 0.85rem;
      display: grid;
      place-items: center;
    }

    .brand-logo img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      display: block;
      animation: fade-up 0.6s ease both, glow 4.5s ease-in-out 0.6s infinite;
    }

    .brand h1 { animation: fade-up 0.6s ease 0.08s both; }
    .brand p { animation: fade-up 0.6s ease 0.16s both; }

    .brand h1 {
      font-family: 'Sora', sans-serif;
      font-size: 1.32rem;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }

    .brand h1 span { color: var(--accent); }

    .brand p {
      display: inline-block;
      position: relative;
      font-size: 0.84rem;
      line-height: 1.45;
      color: var(--muted);
      padding-bottom: 0.95rem;
    }

    .brand p::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 28px;
      height: 2px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.45);
      transform: translateX(-50%);
      animation:
        line-out 1.3s ease-in-out 0.5s forwards,
        line-scan 5.8s ease-in-out 1.8s infinite;
    }

    @keyframes line-out {
      from { left: 50%; transform: translateX(-50%); }
      to { left: 66%; transform: translateX(-50%); }
    }

    @keyframes line-scan {
      0%, 100% { left: 66%; transform: translateX(-50%); }
      50% { left: 34%; transform: translateX(-50%); }
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      padding: 0.35rem 0 0.5rem;
    }

    .card {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 16px;
      align-items: center;
      column-gap: 0.85rem;
      min-height: 64px;
      padding: 0.8rem 0.95rem;
      background: rgba(10, 37, 64, 0.35);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      animation: fade-up 0.55s ease both;
      transition: transform var(--ease), border-color var(--ease), background var(--ease), box-shadow var(--ease);
    }

    .links .card:nth-child(1) { animation-delay: 0.22s; }
    .links .card:nth-child(2) { animation-delay: 0.3s; }
    .links .card:nth-child(3) { animation-delay: 0.38s; }
    .links .card:nth-child(4) { animation-delay: 0.46s; }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(59, 130, 246, 0.55);
      background: rgba(59, 130, 246, 0.12);
    }

    .card:hover .card-icon,
    .card:focus-visible .card-icon {
      transform: scale(1.06);
    }

    .card:hover .card-arrow,
    .card:focus-visible .card-arrow {
      transform: translateX(4px);
    }

    .card-primary {
      background: var(--accent);
      border-color: transparent;
      animation: fade-up 0.55s ease 0.22s both, pulse-soft 3.8s ease-in-out 1s infinite;
    }

    .card-primary:hover,
    .card-primary:focus-visible {
      background: var(--accent-hover);
      border-color: transparent;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.38);
    }

    .card-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(59, 130, 246, 0.18);
      color: var(--accent);
      transition: transform var(--ease);
    }

    .card-primary .card-icon {
      background: rgba(255, 255, 255, 0.16);
      color: var(--white);
    }

    .card-icon svg { width: 18px; height: 18px; display: block; }

    .card-text { min-width: 0; }

    .card-text strong {
      display: block;
      font-family: 'Sora', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .card-sub {
      display: block;
      margin-top: 0.14rem;
      font-size: 0.74rem;
      line-height: 1.3;
      color: var(--muted);
    }

    .card-primary .card-sub { color: rgba(255, 255, 255, 0.86); }

    .card-arrow {
      width: 16px;
      height: 16px;
      color: var(--accent);
      justify-self: end;
      transition: transform var(--ease);
    }

    .card-primary .card-arrow { color: var(--white); }

    .bottom {
      flex-shrink: 0;
      padding-top: 0.35rem;
      text-align: center;
      animation: fade-up 0.55s ease 0.54s both;
    }

    .speak {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.85rem;
    }

    .speak::before,
    .speak::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent));
    }

    .speak::after {
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .speak span {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--accent);
      white-space: nowrap;
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 0.7rem;
      margin-bottom: 0.85rem;
    }

    .social a {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 50%;
      color: var(--white);
      background: rgba(10, 37, 64, 0.4);
      transition: transform var(--ease), background var(--ease), box-shadow var(--ease);
    }

    .social a svg { width: 17px; height: 17px; }
    .social a:hover,
    .social a:focus-visible {
      transform: translateY(-2px);
      background: rgba(59, 130, 246, 0.16);
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.25);
    }

    footer {
      font-family: 'Sora', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--white);
    }

    .card:focus-visible,
    .social a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .brand-logo img,
      .brand h1,
      .brand p,
      .card,
      .card-primary,
      .bottom {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: drop-shadow(0 8px 18px rgba(59, 130, 246, 0.28));
      }
      .brand p::after {
        animation: none !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
      }
    }

    @media (max-height: 680px) {
      .wrap { padding-top: 1.1rem; padding-bottom: 0.9rem; }
      .brand-logo { width: 76px; height: 76px; margin-bottom: 0.7rem; }
      .brand-logo img { width: 72px; height: 72px; }
      .brand h1 { margin-bottom: 0.3rem; }
      .links { gap: 0.55rem; }
      .card { min-height: 56px; padding: 0.7rem 0.9rem; }
    }
  </style>
</head>

  <script>

      var WHATSAPP_MESSAGE = 'Olá! Gostaria de conversar sobre os serviços de presença digital para meu negócio.';
      var INSTAGRAM_URL = 'https://www.instagram.com/identidade.web';
      var waUrl = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(WHATSAPP_MESSAGE);

    })();
