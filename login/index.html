<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A2540" />
  <title>Entrar | Identidade Web</title>
  <link rel="icon" type="image/png" href="/assets/logo%20identidade%20web.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0A2540;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --white: #FFFFFF;
      --muted: #64748B;
      --line: #E2E8F0;
      --bg: #F8FAFC;
      --error: #B42318;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      color: var(--navy);
      background: var(--bg);
      min-height: 100vh;
    }
    body::before {
      content: '';
      display: block;
      height: 3px;
      background: var(--accent);
    }
    .wrap {
      min-height: calc(100vh - 3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 2.25rem 1.75rem 1.85rem;
      box-shadow: 0 12px 32px rgba(10, 37, 64, 0.05);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }
    .brand img { height: 36px; width: auto; display: block; }
    .brand span {
      font-family: Sora, sans-serif;
      font-weight: 700;
      font-size: 1.02rem;
      letter-spacing: -0.02em;
    }
    .brand span em { font-style: normal; color: var(--accent); }
    h1 {
      font-family: Sora, sans-serif;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
      margin-bottom: 1.35rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .field { margin-bottom: 0.95rem; }
    input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 0.9rem;
      font: 400 16px/1.4 Inter, system-ui, sans-serif;
      color: var(--navy);
      background: var(--white);
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.16);
    }
    .error {
      display: none;
      margin: 0 0 1rem;
      color: var(--error);
      font-size: 0.88rem;
      font-weight: 500;
    }
    .error.is-shown { display: block; }
    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--white);
      font: 600 0.95rem/1 Inter, system-ui, sans-serif;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.7; cursor: wait; }
  </style>
</head>
<body>
  <main class="wrap">
    <form class="card" id="login-form" novalidate>
      <div class="brand">
        <img src="/assets/logo%20identidade%20web.png" alt="Identidade Web" width="36" height="36" />
        <span>Identidade <em>Web</em></span>
      </div>
      <h1>Entrar</h1>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <p class="error" id="login-error" role="alert"></p>
      <button type="submit" id="login-submit">Entrar</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var emailEl = document.getElementById('email');
      var passwordEl = document.getElementById('password');
      var errorEl = document.getElementById('login-error');
      var submitEl = document.getElementById('login-submit');
      var sending = false;

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add('is-shown');
      }

      function hideError() {
        errorEl.textContent = '';
        errorEl.classList.remove('is-shown');
      }

      IWAuth.getSession().then(function (session) {
        if (session) window.location.replace('/crm/');
      }).catch(function () {});

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (sending) return;

        var email = (emailEl.value || '').replace(/^\s+|\s+$/g, '');
        var password = passwordEl.value || '';
        if (!email || !password) {
          showError('Informe e-mail e senha.');
          return;
        }

        sending = true;
        hideError();
        submitEl.disabled = true;
        submitEl.textContent = 'Entrando...';

        IWAuth.signIn(email, password).then(function (result) {
          if (result.error || !result.data || !result.data.session) {
            var code = result.error && result.error.code;
            if (code === 'email_not_confirmed') {
              showError('Confirme seu e-mail.');
            } else {
              showError('E-mail ou senha inválidos.');
            }
            sending = false;
            submitEl.disabled = false;
            submitEl.textContent = 'Entrar';
            return;
          }
          window.location.replace('/crm/');
        }).catch(function () {
          console.error('Login: configuração indisponível.');
          showError('Não foi possível entrar.');
          sending = false;
          submitEl.disabled = false;
          submitEl.textContent = 'Entrar';
        });
      });
    })();
  </script>
</body>
</html>
