<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A2540" />
  <title>Entrar | Identidade Web</title>
  <link rel="icon" type="image/png" href="/assets/logo%20identidade%20web.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0A2540;
      --accent: #3B82F6;
      --accent-hover: #2563EB;
      --white: #FFFFFF;
      --muted: #5B6B7C;
      --line: #E2E8F0;
      --bg: #F4F7FB;
      --error: #B42318;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      color: var(--navy);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    body::before {
      content: '';
      display: block;
      height: 3px;
      width: 100%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1.25rem 2.5rem;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 2rem 1.5rem 1.75rem;
      box-shadow: 0 10px 30px rgba(10, 37, 64, 0.06);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .brand img {
      height: 40px;
      width: auto;
      display: block;
    }
    .brand span {
      font-family: Sora, sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }
    .brand span em {
      font-style: normal;
      color: var(--accent);
    }
    h1 {
      font-family: Sora, sans-serif;
      font-size: 1.45rem;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }
    .lead {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    .field { margin-bottom: 1rem; }
    input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 0.9rem;
      font: 400 16px/1.4 Inter, system-ui, sans-serif;
      color: var(--navy);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }
    .error {
      display: none;
      margin: 0 0 1rem;
      padding: 0.7rem 0.8rem;
      border-radius: 10px;
      background: #FEF3F2;
      color: var(--error);
      font-size: 0.88rem;
      font-weight: 500;
    }
    .error.is-shown { display: block; }
    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--white);
      font: 600 0.95rem/1 Inter, system-ui, sans-serif;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    @media (max-width: 480px) {
      .card { padding: 1.5rem 1.15rem 1.4rem; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <form class="card" id="login-form" novalidate>
      <div class="brand">
        <img src="/assets/logo%20identidade%20web.png" alt="Identidade Web" width="40" height="40" />
        <span>Identidade <em>Web</em></span>
      </div>
      <h1>Entrar</h1>
      <p class="lead">Área administrativa. Informe seu e-mail e senha.</p>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <p class="error" id="login-error" role="alert">E-mail ou senha inválidos.</p>
      <button type="submit" id="login-submit">Entrar</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var emailEl = document.getElementById('email');
      var passwordEl = document.getElementById('password');
      var errorEl = document.getElementById('login-error');
      var submitEl = document.getElementById('login-submit');
      var sending = false;

      function showError() {
        errorEl.classList.add('is-shown');
      }

      function hideError() {
        errorEl.classList.remove('is-shown');
      }

      IWAuth.getSession().then(function (session) {
        if (session) window.location.replace('/crm/');
      }).catch(function () {});

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (sending) return;

        var email = (emailEl.value || '').replace(/^\s+|\s+$/g, '');
        var password = passwordEl.value || '';
        if (!email || !password) {
          showError();
          return;
        }

        sending = true;
        hideError();
        submitEl.disabled = true;
        submitEl.textContent = 'Entrando...';

        IWAuth.signIn(email, password).then(function (result) {
          if (result.error || !result.data || !result.data.session) {
            console.error('Login: e-mail ou senha inválidos.');
            showError();
            sending = false;
            submitEl.disabled = false;
            submitEl.textContent = 'Entrar';
            return;
          }
          window.location.replace('/crm/');
        }).catch(function () {
          console.error('Login: não foi possível autenticar.');
          showError();
          sending = false;
          submitEl.disabled = false;
          submitEl.textContent = 'Entrar';
        });
      });
    })();
  </script>
</body>
</html>
